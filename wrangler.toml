name = "mailfree"
# name = "mail-exhibit"
main = "src/server.js"
compatibility_date = "2024-01-01"
workers_dev = false
preview_urls = false
keep_vars = true

# 注意：keep_vars 只会保留 Dashboard/远端已有变量（例如 MAIL_DOMAIN、JWT secrets 等），
# 不会保留 routes/custom_domain 配置。部署前若本地 wrangler.toml 里的 routes/custom_domain
# 与线上不一致，Wrangler 仍可能覆盖线上路由/自定义域名设置。
# 推荐日常发布使用 `npm run deploy`（wrangler versions upload），只上传代码版本，不直接改 routes/custom_domain。
# 如需完整改动 Worker 配置，再显式使用 `npm run deploy:full`。

# [[routes]]
# pattern = "mail.gemnwong.dpdns.org"
# zone_name = "gemnwong.dpdns.org"

# [[routes]]
# pattern = "mail.gemnwong.dpdns.org"
# zone_name = "gemnwong.dpdns.org"
# custom_domain = true

[triggers]
crons = ["*/5 * * * *"]

# D1 数据库绑定
[[d1_databases]]
binding = "TEMP_MAIL_DB"
database_name = "maill_free_db" #你的d1数据库名称
database_id = "b4803635-fc06-4d3a-abcb-cb1f1b9c5162" # 你的database_id
# 登录会话过期时间（单位：天，默认7天）
# 环境变量
[vars]
MAIL_DOMAIN = "vibewatcher.eu.cc, openclw.ccwu.cc, jhailab.eu.cc, jhai.eu.cc"
# FORWARD_RULES="[{"prefix":"vip","email":"a@example.com"},{"prefix":"*","email":"2141083706@qq.com"}]"


# 静态资源目录（Workers + Assets）
[assets]
directory = "public"
# 显式指定绑定名，确保在 Worker 中通过 env.ASSETS 可用
binding = "ASSETS"


# R2 存储桶绑定（用于保存完整 EML 内容）
[[r2_buckets]]
binding = "MAIL_EML"
bucket_name = "mail-eml"

# wrangler.toml (wrangler v3.88.0^) 日志服务
# [observability.logs]
# enabled = true



